<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="referrer" content="no-referrer">
<title>私密报告 · 链接访问</title>
<link rel="stylesheet" href="gateway-v8.css">
<script src="gateway-v22.js" defer></script>
</head>
<body>
<main id="gate" aria-live="polite">
  <span class="label">PRIVATE REPORT</span>
  <h1 id="status">正在检查分享链接</h1>
  <p id="detail">请使用分享者提供的完整链接。</p>
  <p class="hint">完整链接包含访问凭证，请仅转发给需要阅读的人。</p>
</main>
<iframe id="report" title="评测报告" referrerpolicy="no-referrer" hidden></iframe>
<noscript>请启用 JavaScript，以在浏览器内解密报告。</noscript>
</body>
</html>
